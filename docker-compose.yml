services:
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
      POSTGRES_DB: linkforge
    ports:
      - "5432:5432"
    volumes:
      - linkforge-postgres-data:/var/lib/postgresql/data

volumes:
  linkforge-postgres-data: